<!DOCTYPE html>
<html>
<head>
    <title>Flask Practice</title>
</head>
<body>
    <ul>
    <h1>Courses:</h1>
    {% for course in courses %}
    <h2><li>{{loop.index}} {{course}}</li></h2>
    {% endfor %}
    </ul>
<hr>
<hr>
    <h1>Student Details</h1>
    <h2>
        {% for key,value in student.items() %}
    <li> {{key}} : {{value}}</li>
    {% endfor %}
    </h2>

</body>
</html>
